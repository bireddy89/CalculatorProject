# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml


trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# CI STAGE
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildJob
    displayName: 'Python Build Job'

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'
      displayName: 'Install Python'

    - script: |
        python -m pip install --upgrade pip
        echo "No external dependencies required"
      displayName: 'Install Dependencies'

    - script: |
        python calculator.py
      displayName: 'Run Calculator'

    - script: |
        python -m unittest -v
      displayName: 'Run Unit Tests'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)'
        artifact: 'CalculatorArtifact'
        publishLocation: 'pipeline'
      displayName: 'Publish Build Artifact'

# CD STAGE
- stage: Deploy
  displayName: 'Deployment Stage'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployJob
    displayName: 'Prepare Deployment Package'

    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'CalculatorArtifact'
        path: '$(Pipeline.Workspace)/CalculatorArtifact'
      displayName: 'Download Build Artifact'

    - script: |
        echo "Calculator deployment package downloaded successfully"
        ls -la "$(Pipeline.Workspace)/CalculatorArtifact"
      displayName: 'Verify Deployment Package'
